<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plywood Quote 0.5mm</title>

<style>

body{
font-family:Arial;
max-width:390px;
margin:auto;
padding:10px;
}

h2{
text-align:center;
font-size:20px;
margin-bottom:10px;
}

label{
font-size:14px;
}

input{

width:100%;
height:30px;

padding:4px 6px;

margin-bottom:6px;

font-size:14px;

box-sizing:border-box;

}

.result{
font-size:15px;
margin-top:4px;
font-weight:bold;
}

.blue{color:blue;}
.red{color:red;}

</style>

</head>

<body>

<h2>Plywood Quote 0.5mm</h2>

<label>Thickness (mm)</label>
<input id="thickness">

<label>Bundles</label>
<input id="bundles">

<label>PCS / Bundle</label>
<input id="pcsBundle">

<label>EXW / PCS (VND)</label>
<input id="exwPcs">

<label>EXW / CBM (VND)</label>
<input id="exwCbm">

<label>Logistics (VND)</label>
<input id="logistics">

<label>CFR Price (VND)</label>
<input id="cfr">

<hr>

<div class="result">CBM Buy: <span id="cbmBuy"></span></div>
<div class="result">CBM Sell: <span id="cbmSell"></span></div>
<div class="result">CBM Diff: <span id="cbmDiff"></span></div>

<div class="result">Profit / CBM: <span id="profitCbm"></span></div>
<div class="result">Profit Total: <span id="profitTotal"></span></div>

<script>

const width=1220
const length=2440

function num(id){

let v=document.getElementById(id).value.replace(/,/g,'')

return Number(v)||0

}

function format(x){

return Number(x).toLocaleString()

}

document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",calc)
})

function calc(){

let thickness=num("thickness")
let bundles=num("bundles")
let pcsBundle=num("pcsBundle")

let exwPcs=num("exwPcs")
let exwCbm=num("exwCbm")

let logistics=num("logistics")
let cfr=num("cfr")

let pcs=bundles*pcsBundle

let thSell=thickness+0.5


let cbmBuy=pcs*(width/1000)*(length/1000)*(thickness/1000)

let cbmSell=pcs*(width/1000)*(length/1000)*(thSell/1000)

let cbmDiff=cbmSell-cbmBuy


let cost=0

if(exwPcs>0){

cost=pcs*exwPcs

}else{

cost=cbmBuy*exwCbm

}

cost=cost+logistics


let profit=cfr-cost

let profitCbm=profit/cbmSell


document.getElementById("cbmBuy").innerText=format(cbmBuy.toFixed(2))

document.getElementById("cbmSell").innerText=format(cbmSell.toFixed(2))

document.getElementById("cbmDiff").innerText=format(cbmDiff.toFixed(2))


let pt=document.getElementById("profitTotal")
let pc=document.getElementById("profitCbm")

pt.innerText=format(Math.round(profit))
pc.innerText=format(Math.round(profitCbm))


if(profit>=0){

pt.className="result blue"
pc.className="result blue"

}else{

pt.className="result red"
pc.className="result red"

}


document.querySelectorAll("input").forEach(i=>{

let v=i.value.replace(/,/g,'')

if(v!=""){

i.value=format(v)

}

})

}

</script>

</body>
</html>
